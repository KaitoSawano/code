description "Litemoney Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env LITEMONEYD_BIN="/usr/bin/litemoneyd"
env LITEMONEYD_USER="litemoney"
env LITEMONEYD_GROUP="litemoney"
env LITEMONEYD_PIDDIR="/var/run/litemoneyd"
# upstart can't handle variables constructed with other variables
env LITEMONEYD_PIDFILE="/var/run/litemoneyd/litemoneyd.pid"
env LITEMONEYD_CONFIGFILE="/etc/litemoney/litemoney.conf"
env LITEMONEYD_DATADIR="/var/lib/litemoneyd"

expect fork

respawn
respawn limit 5 120
kill timeout 60

pre-start script
    # this will catch non-existent config files
    # litemoneyd will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$LITEMONEYD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run litemoneyd."
        echo "The setting must appear in $LITEMONEYD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following"
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is also recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Litemoney Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$LITEMONEYD_PIDDIR"
    chmod 0755 "$LITEMONEYD_PIDDIR"
    chown $LITEMONEYD_USER:$LITEMONEYD_GROUP "$LITEMONEYD_PIDDIR"
    chown $LITEMONEYD_USER:$LITEMONEYD_GROUP "$LITEMONEYD_CONFIGFILE"
    chmod 0660 "$LITEMONEYD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$LITEMONEYD_PIDFILE" \
    --chuid $LITEMONEYD_USER:$LITEMONEYD_GROUP \
    --exec "$LITEMONEYD_BIN" \
    -- \
    -pid="$LITEMONEYD_PIDFILE" \
    -conf="$LITEMONEYD_CONFIGFILE" \
    -datadir="$LITEMONEYD_DATADIR" \
    -disablewallet \
    -daemon

